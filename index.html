<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>ishwacha</title>
    <!-- Подключение шрифта Inter (не блокирует первую отрисовку) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            media="print"
            onload="this.media='all'"
    >
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    </noscript>

</head>
<body>
<div id="app"></div>

<script>
    // До загрузки Vue: язык из localStorage, чтобы <html lang> не мигал
    try {
        var savedLang = localStorage.getItem('lang');
        if (savedLang === 'ru' || savedLang === 'en') document.documentElement.lang = savedLang;
    } catch (e) {
    }
</script>
<script type="module" src="/src/main.js"></script>

</body>
</html>
<style>
    body { background: #121821;}
</style>
